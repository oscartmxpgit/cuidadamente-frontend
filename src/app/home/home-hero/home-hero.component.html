<div class="hero">
  <!-- Transparent background image layer -->
  <div class="hero-bg" [style.background-image]="'url(' + imageUrl + ')'"></div>

  <div class="tb-container tb-position--relative container">
    <div class="content-container" fxLayout="row" fxLayout.xs="column" fxLayoutAlign="space-between start">
      <!-- Text Content -->
      <div fxFlex="70" fxFlex.xs="100" fxLayout="column" class="text-section">
        <div ngClass.gt-sm="tb-height--80" ngClass.sm="tb-height--50" ngClass.xs="tb-height--30"></div>

        <!-- Logo -->
        <div class="hero-logo">
          <img src="assets/images/LogoTransp.png" alt="Logo" class="navbar-logo">
        </div>

        <div ngClass.gt-sm="tb-height--16" ngClass.sm="tb-height--12" ngClass.xs="tb-height--10"></div>

        <!-- Main Headline -->
        <h1 [@transitionTextEnter]="{value:'in', params:{animDelay:300}}"
            ngClass.gt-sm="current-typo--h1-light"
            ngClass.sm="current-typo--h2-light"
            ngClass.xs="current-typo--h3"
            class="hero-headline">
          {{ heroTitle }}
        </h1>

        <!-- Subheadline -->
        <h2 [@transitionTextEnter]="{value:'in', params:{animDelay:500}}"
            class="hero-subheadline">
          {{ heroSubtitle }}
        </h2>

        <!-- Hero Button -->
        <button class="hero-button"
                [@transitionTextEnter]="{value:'in', params:{animDelay:600}}"
                routerLink="/registro-cita">
          Pedir cita
        </button>

        <!-- Contact Info -->
        <div class="hero-contact" [@transitionTextEnter]="{value:'in', params:{animDelay:700}}" *ngIf="phone || email || address">
          <p *ngIf="phone"><i class="fas fa-phone"></i> Tlf: {{ phone }}</p>
          <p *ngIf="email"><i class="fas fa-envelope"></i> Correo electrónico: {{ email }}</p>
          <p *ngIf="address"><i class="fas fa-map-marker-alt"></i> Dirección: {{ address }}</p>
        </div>

        <div ngClass.gt-sm="tb-height--80" ngClass.sm="tb-height--50" ngClass.xs="tb-height--30"></div>
      </div>
    </div>
  </div>
</div>
