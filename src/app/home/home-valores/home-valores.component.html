<section class="valores-section">
  <h2 class="section-title">Nuestros valores</h2>
  <p class="section-subtitle">Principios que guían nuestro trabajo y compromiso contigo</p>

  <div class="valores-container">
    <div class="valor-card" *ngFor="let valor of valores">
      <img [src]="valor.icono" alt="{{ valor.titulo }}" class="valor-icon" />
      <h3 class="valor-title">{{ valor.titulo }}</h3>
      <p class="valor-description">{{ valor.descripcion }}</p>
    </div>
  </div>
</section>
