<h2>Listado de Citas</h2>
<table *ngIf="!loading">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Teléfono</th>
      <th>Email</th>
      <th>Servicio</th>
      <th>Fecha</th>
      <th>Hora</th>
      <th>Fecha Solicitud</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cita of citas">
      <td>{{ cita.nombre }}</td>
      <td>{{ cita.telefono }}</td>
      <td>{{ cita.email }}</td>
      <td>{{ cita.servicio }}</td>
      <td>{{ cita.fecha | date }}</td>
      <td>{{ cita.hora }}</td>
      <td>{{ cita.fechaSolicitud | date:'short' }}</td>
    </tr>
  </tbody>
</table>
<div *ngIf="loading">Cargando...</div>
