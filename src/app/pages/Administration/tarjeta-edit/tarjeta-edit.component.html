<h2>{{ esEdicion ? 'Editar Tarjeta' : 'Crear Tarjeta' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Título</mat-label>
    <input matInput formControlName="title" required />
    <mat-error *ngIf="form.controls['title'].invalid">El título es
      obligatorio</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Subtítulo</mat-label>
    <input matInput formControlName="subtitle" />
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Idioma</mat-label>
    <mat-select formControlName="language">
      <mat-option value="es">Español</mat-option>
      <mat-option value="en">Inglés</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Tipo</mat-label>
    <mat-select formControlName="tipo" required>
      <mat-option *ngFor="let t of tipos" [value]="t">{{ t }}</mat-option>
    </mat-select>
    <mat-error *ngIf="form.controls['tipo'].invalid">El tipo es
      obligatorio</mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Archivo Imagen</mat-label>
    <input matInput formControlName="imageFileName" />
  </mat-form-field>

  <div class="full-width">
  <mat-label>Descripción</mat-label>
  <quill-editor
    formControlName="description"
    [modules]="quillModules"
    class="quill-editor"
    placeholder="Escribe la descripción aquí..."
  ></quill-editor>
</div>


  <div class="form-actions">
    <button mat-raised-button color="primary" type="submit"
      [disabled]="form.invalid || loading">
      Guardar
    </button>
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
  </div>

</form>
