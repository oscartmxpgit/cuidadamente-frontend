<h2>Listado de Servicios</h2>

<button mat-raised-button color="primary" routerLink="/services/create" style="margin-bottom: 1rem;">
  Crear Servicio
</button>

<table mat-table [dataSource]="services" class="mat-elevation-z2" *ngIf="!loading">

  <!-- Título -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Título</th>
    <td mat-cell *matCellDef="let service">{{ service.title }}</td>
  </ng-container>

  <!-- Imagen archivo -->
  <ng-container matColumnDef="imageFileName">
    <th mat-header-cell *matHeaderCellDef>Archivo Imagen</th>
    <td mat-cell *matCellDef="let service">{{ service.imageFileName }}</td>
  </ng-container>

  <!-- Descripción -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let service">{{ service.description }}</td>
  </ng-container>

  <!-- Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let service">
      <button mat-button color="accent" (click)="abrirDialogoEdicion(service)">Editar</button>
    <button mat-button color="warn" (click)="eliminarServicio(service.id)">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div *ngIf="loading">Cargando...</div>
