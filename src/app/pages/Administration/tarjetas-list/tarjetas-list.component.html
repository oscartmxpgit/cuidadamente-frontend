<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
  <div>
    <h2 style="margin: 0;">Listado de Servicios</h2>
    <button mat-raised-button color="primary" (click)="abrirDialogoCrear()" style="margin-top: 8px;">
      Crear Servicio
    </button>
  </div>

  <mat-form-field appearance="fill" style="width: 200px;">
    <mat-label>Filtrar por Tipo</mat-label>
    <mat-select [(value)]="tipoSeleccionado" (selectionChange)="cargarTarjetas()">
      <mat-option value="">Todos</mat-option>
      <mat-option value="Servicio">Servicio</mat-option>
      <mat-option value="Valores">Valores</mat-option>
      <mat-option value="Otro">Otro</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<table mat-table [dataSource]="services" class="mat-elevation-z2" *ngIf="!loading">

  <!-- Título -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Título</th>
    <td mat-cell *matCellDef="let service">{{ service.title }}</td>
  </ng-container>

  <!-- Imagen archivo -->
  <ng-container matColumnDef="imageFileName">
    <th mat-header-cell *matHeaderCellDef>Archivo Imagen</th>
    <td mat-cell *matCellDef="let service">{{ service.imageFileName }}</td>
  </ng-container>

  <!-- Descripción -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Descripción</th>
    <td mat-cell *matCellDef="let service">{{ service.description }}</td>
  </ng-container>

  <!-- Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let service">
      <button mat-button color="accent" (click)="abrirDialogoEdicion(service)">Editar</button>
      <button mat-button color="warn" (click)="eliminarTarjeta(service.id)">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div *ngIf="loading">Cargando...</div>
