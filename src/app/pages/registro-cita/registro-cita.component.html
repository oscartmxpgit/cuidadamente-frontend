<h2>Registro de cita online</h2>
<form [formGroup]="citaForm" (ngSubmit)="onSubmit()" autocomplete="on">
  <div>
    <label>Nombre completo:</label>
    <input formControlName="nombre" required autocomplete="name">
    <div class="error" *ngIf="citaForm.get('nombre')?.invalid && citaForm.get('nombre')?.touched">
      El nombre es obligatorio.
    </div>
  </div>
  <div>
    <label>Teléfono:</label>
    <input formControlName="telefono" required autocomplete="tel">
    <div class="error" *ngIf="citaForm.get('telefono')?.invalid && citaForm.get('telefono')?.touched">
      El teléfono es obligatorio.
    </div>
  </div>
  <div>
    <label>Email:</label>
    <input formControlName="email" required type="email" autocomplete="email">
    <div class="error" *ngIf="citaForm.get('email')?.invalid && citaForm.get('email')?.touched">
      Introduce un email válido.
    </div>
  </div>
  <div>
    <label>Servicio:</label>
    <select formControlName="servicio" required autocomplete="off">
      <option *ngFor="let s of servicios" [value]="s">{{s}}</option>
    </select>
    <div class="error" *ngIf="citaForm.get('servicio')?.invalid && citaForm.get('servicio')?.touched">
      Selecciona un servicio.
    </div>
  </div>
  <div>
    <label>Día:</label>
    <input formControlName="fecha" [matDatepicker]="picker" required autocomplete="off">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <div class="error" *ngIf="citaForm.get('fecha')?.invalid && citaForm.get('fecha')?.touched">
      Selecciona un día.
    </div>
  </div>
  <div>
    <label>Hora:</label>
    <select formControlName="hora" required autocomplete="off">
      <option *ngFor="let h of horasDisponibles" [value]="h">{{h}}</option>
    </select>
    <div class="error" *ngIf="citaForm.get('hora')?.invalid && citaForm.get('hora')?.touched">
      Selecciona una hora.
    </div>
  </div>
  <button type="submit" [disabled]="citaForm.invalid">Reservar cita</button>
</form>

<style>
.error {
  color: #d32f2f;
  font-size: 0.95em;
  margin-top: 0.2em;
}
</style>
