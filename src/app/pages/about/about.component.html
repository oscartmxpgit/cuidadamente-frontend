<section class="about">
  <div class="container">
    <h2>¿Quiénes somos?</h2>

    <div class="team-grid">
      <ng-container *ngFor="let member of teamMembers">
        <div class="team-card" *ngIf="getImageUrl(member)" (click)="onCardClick($event, member)">
          <img [src]="getImageUrl(member)" [alt]="member.title" />

          <div class="team-content">
            <h3>{{ member.title }}</h3>
            <h4 *ngIf="member.subtitle" class="team-subtitle">{{ member.subtitle }}</h4>
            <p>
              {{
                showFull[member.title]
                  ? member.description
                  : (member.description ? (member.description | slice:0:150) + '...' : '')
              }}
            </p>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" *ngIf="selectedMember" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <span class="close" (click)="closeModal()">&times;</span>
      <img *ngIf="getImageUrl(selectedMember)" [src]="getImageUrl(selectedMember)" [alt]="selectedMember.title" />
      <h3>{{ selectedMember.title }}</h3>
      <h4 *ngIf="selectedMember.subtitle">{{ selectedMember.subtitle }}</h4>
      <p>{{ selectedMember.description }}</p>
    </div>
  </div>
</section>
