<section class="about">
  <div class="container">
    <h2>¿Quiénes somos?</h2>

    <div class="about-section">
      <div class="team-grid">
        <ng-container *ngFor="let member of teamMembers">
          <div 
            class="team-card" 
            *ngIf="imageUrls[member.imageFileName]"
            (click)="onCardClick($event, member)">
            
            <img [src]="getImageUrl(member.imageFileName)" [alt]="member.altText" />
            
            <div class="team-content">
              <div [innerHTML]="truncateHtml(member.htmlContent || '', 100)"></div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" *ngIf="selectedMember" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <span class="close" (click)="closeModal()">&times;</span>
      <img [src]="getImageUrl(selectedMember.imageFileName)" [alt]="selectedMember.altText" />
      <div [innerHTML]="selectedMember.htmlContent"></div>
    </div>
  </div>
</section>
