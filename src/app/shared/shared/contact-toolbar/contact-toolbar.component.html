<div class="contact-toolbar">
  <a *ngIf="phone" [href]="'tel:' + phone" title="Llamar">
    <i class="fas fa-phone"></i> <span class="text">{{ phone }}</span>
  </a>
  <a *ngIf="email" [href]="'mailto:' + email" title="Enviar correo">
    <i class="fas fa-envelope"></i> <span class="text">{{ email }}</span>
  </a>
  <a href="https://wa.me/34682391660" target="_blank" rel="noopener" title="WhatsApp">
    <i class="fab fa-whatsapp"></i> <span class="text">WhatsApp</span>
  </a>
  <a *ngIf="address" [href]="'https://www.google.com/maps/search/?api=1&query=' + encodeUri(address)" target="_blank" rel="noopener" class="contact-link" title="Ver en Google Maps">
    <i class="fas fa-map-marker-alt"></i> <span class="text">{{ address }}</span>
  </a>
</div>
