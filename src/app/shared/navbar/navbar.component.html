<!-- navbar.component.html -->
<nav class="navbar">
  <div class="navbar-brand-container">
    <a routerLink="/" class="nav-link" (click)="closeMenu()">
      <span class="highlighted-word">{{ brandLabel }}</span>
    </a>

    <a routerLink="/registro-cita" 
       class="nav-cta" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="closeMenu()"
       *ngIf="shouldShowCitaBtn()">
      {{ citaLabel }}
    </a>
  </div>

  <div class="navbar-toggle" (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="navbar-menu" [class.is-active]="menuActive">
    <a routerLink="/about" 
       class="nav-link" 
       routerLinkActive="active"
       (click)="closeMenu()">
      {{ aboutLabel }}
    </a>
    <a routerLink="/services" 
       class="nav-link" 
       routerLinkActive="active"
       (click)="closeMenu()">
      {{ servicesLabel }}
    </a>

    <ng-template #loginBtn>
      <a routerLink="/login" 
         class="nav-login-discrete" 
         routerLinkActive="active"
         (click)="closeMenu()">Login</a>
    </ng-template>

    <ng-container *ngIf="authService.isAuthenticated(); else loginBtn">
      <a routerLink="/admin-dashboard" 
         *ngIf="authService.isAdmin()"
         class="nav-link" 
         routerLinkActive="active"
         (click)="closeMenu()">Administración</a>
      <button (click)="logout()" class="nav-subtle">Salir</button>
    </ng-container>
  </div>
</nav>
