<nav class="navbar"> 
  <div class="navbar-brand">
    <a routerLink="/" class="nav-link" (click)="closeMenu()">
      <span class="highlighted-word">Cuidadamente</span>
    </a>
  </div>

  <a routerLink="/registro-cita" class="nav-cta" (click)="closeMenu()" *ngIf="shouldShowCitaBtn()"> 
    Pedir cita
  </a>

  <div class="navbar-toggle" (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="navbar-menu" [class.is-active]="menuActive">
    <a routerLink="/about" class="nav-link" (click)="closeMenu()">Quiénes Somos</a>
    <a routerLink="/services" class="nav-link" (click)="closeMenu()">Servicios</a>

    <!-- Language selector -->
    <div class="language-selector">
      <button *ngFor="let lang of languages" 
              (click)="switchLanguage(lang)"
              [class.active]="currentLanguage === lang">
        {{ lang.toUpperCase() }}
      </button>
    </div>

    <ng-template #loginBtn>
      <a routerLink="/login" class="nav-login-discrete" (click)="closeMenu()">Login</a>
    </ng-template>

    <ng-container *ngIf="authService.isAuthenticated(); else loginBtn">
      <a routerLink="/admin-dashboard" *ngIf="authService.isAdmin()" class="nav-link" (click)="closeMenu()">Administración</a>
      <button (click)="logout()" class="nav-subtle">Salir</button>
    </ng-container>
  </div>
</nav>
