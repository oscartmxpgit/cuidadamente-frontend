<footer class="footer">
  <!-- Wave separator -->
  <div class="footer-wave">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <path d="M0,64 C360,160 1080,0 1440,64 L1440,150 L0,150 Z" fill="#ffe6cc"/>
    </svg>
  </div>

  <div class="container">
    <div class="footer-content">

      <!-- About -->
      <div class="footer-section">
        <h3>Cuidadamente</h3>
        <p *ngIf="footerAbout">{{ footerAbout }}</p>
      </div>

      <!-- Quick links -->
      <div class="footer-section links">
        <h3>Enlaces Rápidos</h3>
        <ul>
          <li><a routerLink="/">Inicio</a></li>
          <li><a routerLink="/about">Quiénes Somos</a></li>
          <li><a routerLink="/services">Servicios</a></li>
          <li><a routerLink="/faq">FAQ</a></li>
          <li><a routerLink="/contact">Contacto</a></li>
        </ul>
      </div>

      <!-- Contact -->
      <div class="footer-section contact">
        <h3>Contacto</h3>
        <p *ngIf="address"><i class="fas fa-map-marker-alt"></i> Dirección: {{ address }}</p>
        <p *ngIf="phone"><i class="fas fa-phone"></i> Teléfono: {{ phone }}</p>
        <p *ngIf="email"><i class="fas fa-envelope"></i> Email: {{ email }}</p>
      </div>

    </div>

    <!-- Footer bottom -->
    <div class="footer-bottom">
      <div *ngIf="footerBottom">{{ footerBottom }}</div>
    </div>
  </div>
</footer>
