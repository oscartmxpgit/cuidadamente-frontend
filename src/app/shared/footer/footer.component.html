<footer class="footer"> 
  <!-- Wave separator -->
  <div class="footer-wave">
    <svg viewBox="0 0 1440 150" preserveAspectRatio="none">
      <path d="M0,64 C360,160 1080,0 1440,64 L1440,150 L0,150 Z" fill="#ffe6cc"/>
    </svg>
  </div>

  <div class="container">
    <div class="footer-content">

      <!-- About -->
      <div class="footer-section">
        <h3>{{ companyName }}</h3>
        <p *ngIf="footerAbout">{{ footerAbout }}</p>
      </div>

      <!-- Quick links -->
      <div class="footer-section links">
        <h3>{{ quickLinksLabel }}</h3>
        <ul>
          <li><a routerLink="/">{{ homeLabel }}</a></li>
          <li><a routerLink="/about">{{ aboutLabel }}</a></li>
          <li><a routerLink="/services">{{ servicesLabel }}</a></li>
        </ul>
      </div>

      <!-- Contact -->
      <div class="footer-section contact">
        <h3>{{ contactLabel }}</h3>
        <p *ngIf="address"><i class="fas fa-map-marker-alt"></i> {{ address }}</p>
        <p *ngIf="phone"><i class="fas fa-phone"></i> {{ phone }}</p>
        <p *ngIf="email"><i class="fas fa-envelope"></i> {{ email }}</p>
      </div>

    </div>

    <!-- Footer bottom -->
    <div class="footer-bottom">
      <div *ngIf="footerBottom">{{ footerBottom }}</div>
    </div>

    <!-- Auth buttons -->
    <div class="footer-auth">
      <ng-container *ngIf="authService.isAuthenticated(); else loginBtn">
        
        <button (click)="logout()" class="footer-btn logout-btn">Salir</button>
      </ng-container>

      <ng-template #loginBtn>
        <a routerLink="/login" 
           class="footer-btn login-btn" 
           routerLinkActive="active">Login (Administrador)</a>
      </ng-template>
    </div>

  </div>
</footer>
